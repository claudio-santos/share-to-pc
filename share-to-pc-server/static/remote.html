<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121212">
<title>ShareToPC Remote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #121212;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    padding: 24px;
  }
  .container { width: 100%; max-width: 560px; margin: auto; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .topbar h1 { margin-bottom: 0; }
  .remote-link {
    padding: 10px 20px;
    font-size: 1rem;
    background: #4c9aff;
    border-radius: 8px;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }
  .remote-link:hover { background: #3a7fd6; }
  .card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; }
  button {
    padding: 12px 20px;
    font-size: 1rem;
    background: #4c9aff;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #3a7fd6; }
  button:disabled { background: #333; color: #777; cursor: not-allowed; }
  .ctrl-row button { flex: 1; }
  .danger { background: #c44545; }
  .danger:hover { background: #a03535; }
  .ok { color: #7ac97a; }
  .err { color: #e07a7a; }
  .muted { color: #888; font-size: 0.85rem; }
  #title { font-size: 1.05rem; min-height: 1.4em; word-break: break-word; margin-bottom: 6px; }
  #statusLine { margin-bottom: 14px; font-size: 0.95rem; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: #2a2a2a;
    border: 1px solid #444;
  }
  .slider-wrap { margin-bottom: 18px; }
  input[type=range] {
    width: 100%;
    accent-color: #4c9aff;
    margin: 10px 0 4px;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    font-family: monospace;
    font-size: 0.85rem;
    color: #aaa;
  }
  .ctrl-row { margin-bottom: 10px; }
  select {
    padding: 12px 14px;
    font-size: 1rem;
    background: #121212;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    outline: none;
    flex: 1;
  }
  select:focus { border-color: #4c9aff; }
  #msg { min-height: 1.2em; font-size: 0.9rem; margin-top: 12px; }
</style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <h1>ShareToPC Remote</h1>
      <a class="remote-link" href="/">Back</a>
    </div>

    <div class="card">
      <h2>Player</h2>
      <div id="title">Not playing</div>
      <div id="statusLine"><span class="badge" id="srcBadge">mpv</span> <span id="state" class="muted">offline</span></div>
      <div class="slider-wrap">
        <input type="range" id="seek" min="0" max="1" step="0.001" value="0" disabled>
        <div class="time-row"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Controls</h2>
      <div class="row ctrl-row">
        <button id="toggle">Play/Pause</button>
        <button id="fs">Fullscreen</button>
      </div>
      <div class="row ctrl-row">
        <button id="b10">-10s</button>
        <button id="f10">+10s</button>
      </div>
      <div class="row ctrl-row">
        <select id="speed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <div class="row">
        <button id="quit" class="danger">Quit</button>
      </div>
      <div id="msg"></div>
    </div>
  </div>

<script>
function fmt(t) {
  if (!isFinite(t) || t < 0) return '0:00';
  t = Math.floor(t);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const mm = h ? String(m).padStart(2, '0') : String(m);
  const ss = String(s).padStart(2, '0');
  return h ? h + ':' + mm + ':' + ss : mm + ':' + ss;
}

const $ = id => document.getElementById(id);
let state = { running: false, playing: false, source: 'mpv', title: '', pos: 0, duration: 0, speed: 1 };
let dragging = false;

function cmd(c, v, t) {
  const body = { cmd: c };
  if (v !== undefined) body.value = v;
  if (t !== undefined) body.type = t;
  return fetch('/remote/cmd', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(res => {
    if (!res.ok) return res.json().then(d => Promise.reject(new Error((d && d.error) || res.status)));
    return res.json();
  });
}

function msg(text, cls) {
  const el = $('msg');
  el.textContent = text || '';
  el.className = cls || '';
}

function setRunning(on) {
  state.running = on;
  ['toggle', 'fs', 'b10', 'f10', 'speed', 'seek', 'quit'].forEach(id => $(id).disabled = !on);
}

function render() {
  const s = state;
  $('title').textContent = s.running && s.title ? s.title : (s.running ? 'Playing media' : 'Not playing');
  $('srcBadge').textContent = s.source || 'mpv';
  const st = $('state');
  if (!s.running) { st.textContent = 'offline'; st.className = 'err'; }
  else if (s.playing) { st.textContent = 'playing'; st.className = 'ok'; }
  else { st.textContent = 'paused'; st.className = 'muted'; }
  $('cur').textContent = fmt(s.pos);
  $('dur').textContent = fmt(s.duration);
  const seek = $('seek');
  if (!dragging) {
    seek.max = (s.duration > 0 ? s.duration : 1).toString();
    seek.value = Math.min(s.pos, seek.max);
  }
  const sp = $('speed');
  if (Math.abs((parseFloat(sp.value) || 1) - s.speed) > 0.01) {
    const need = s.speed.toFixed(2);
    let opt = [...sp.options].find(o => o.value === need);
    if (!opt) {
      opt = document.createElement('option');
      opt.value = need;
      opt.textContent = (s.speed % 1 === 0 ? s.speed : s.speed.toFixed(2)) + 'x';
      sp.appendChild(opt);
    }
    sp.value = opt.value;
  }
}

function poll() {
  fetch('/api/player')
    .then(res => res.json())
    .then(d => {
      state.source = d.source || 'mpv';
      state.running = !!d.running;
      state.playing = !!d.playing;
      state.title = d.title || '';
      state.pos = d.pos || 0;
      state.duration = d.duration || 0;
      if (d.speed > 0) state.speed = d.speed;
      setRunning(state.running);
      render();
    })
    .catch(() => {
      state.running = false;
      setRunning(false);
      render();
    });
}

$('toggle').onclick = () => cmd('toggle').catch(e => msg(e.message, 'err'));
$('fs').onclick = () => cmd('fullscreen').catch(e => msg(e.message, 'err'));
$('b10').onclick = () => cmd('seek', -10).catch(e => msg(e.message, 'err'));
$('f10').onclick = () => cmd('seek', 10).catch(e => msg(e.message, 'err'));
$('quit').onclick = () => {
  if (!confirm('Quit and close the player?')) return;
  cmd('quit').catch(e => msg(e.message, 'err'));
};
$('speed').onchange = e => cmd('set_speed', parseFloat(e.target.value)).catch(err => msg(err.message, 'err'));
const seekEl = $('seek');
seekEl.addEventListener('pointerdown', () => { dragging = true; });
seekEl.addEventListener('pointerup', () => {
  dragging = false;
  cmd('seek_to', parseFloat(seekEl.value)).catch(e => msg(e.message, 'err'));
});
seekEl.addEventListener('change', () => {
  dragging = false;
  cmd('seek_to', parseFloat(seekEl.value)).catch(e => msg(e.message, 'err'));
});

setRunning(false);
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
