<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #121212;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container { width: 100%; max-width: 560px; }
  h1 { font-size: 1.6rem; margin-bottom: 8px; }
  .card {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 16px;
  }
  .row { display: flex; gap: 8px; }
  input, select {
    padding: 12px 14px;
    font-size: 1rem;
    background: #121212;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    outline: none;
    width: 100%;
  }
  input:focus, select:focus { border-color: #4c9aff; }
  button {
    padding: 12px 20px;
    font-size: 1rem;
    background: #4c9aff;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #3a7fd6; }
  button:disabled { background: #555; cursor: not-allowed; }
  #pushStatus { margin-top: 12px; font-size: 0.9rem; min-height: 1.2em; }

    <h1>ShareToPC</h1>

    <div class="card">
      <h2>Open URL</h2>
      <div class="row">
        <input type="text" id="url" placeholder="https://youtube.com/watch?v=..." autofocus>
        <button id="btn">Open</button>
      </div>
      <div id="pushStatus"></div>
    </div>

    <div class="card">
      <h2>Android Setup</h2>
      <div class="field">
        <label>Port</label>
        <div class="row">
          <input type="text" id="port" placeholder="8888" style="max-width: 160px;">
          <button id="savePort">Save</button>
        </div>
      </div>
      <div class="field">
        <label>IP for the app</label>
        <select id="ipSelect"></select>
      </div>
      <div class="url-preview" id="urlPreview"></div>
      <div class="qr-wrap" id="qrWrap"><img id="qrImg" alt="QR code"></div>
      <p class="hint">Tap Scan QR Code in the ShareToPC app and point the camera at this code to configure it automatically; or type the IP and port by hand. The port is applied when the server restarts.</p>      <div id="cfgStatus"></div>
    </div>
  </div>

<script>
  const portInput = document.getElementById('port');
  const savePortBtn = document.getElementById('savePort');
  const ipSelect = document.getElementById('ipSelect');
  const urlPreview = document.getElementById('urlPreview');
  const qrImg = document.getElementById('qrImg');
  const pushStatus = document.getElementById('pushStatus');
  const cfgStatus = document.getElementById('cfgStatus');
  const pushBtn = document.getElementById('btn');
  const pushInput = document.getElementById('url');

  let currentPort = null;

  function setPush(msg, cls) {
    pushStatus.textContent = msg;
    pushStatus.className = cls || '';
  }
  function setCfg(msg, cls) {
    cfgStatus.textContent = msg;
    cfgStatus.className = cls || '';
  }

  async function loadConfig() {
    try {
      const res = await fetch('/api/config');
      const data = await res.json();
      currentPort = data.port;
      portInput.value = data.port;
      ipSelect.innerHTML = '';
      data.ips.forEach(ip => {
        const opt = document.createElement('option');
        opt.value = ip;
        opt.textContent = ip;
        ipSelect.appendChild(opt);
      });
      if (data.ips.length === 0) {
        const opt = document.createElement('option');
        opt.value = 'localhost';
        opt.textContent = 'localhost';
        ipSelect.appendChild(opt);
      }
      refreshQR();
    } catch (e) {
      setCfg('Error: could not load config', 'err');
    }
  }

  function refreshQR() {
    const url = `http://${ipSelect.value}:${currentPort}`;
    urlPreview.textContent = url;
    fetch('/api/qrcode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    }).then(res => {
      if (res.ok) return res.blob();
      throw new Error();
    }).then(blob => {
      qrImg.src = URL.createObjectURL(blob);
    }).catch(() => {
      setCfg('Error: could not generate QR', 'err');
    });
  }

  function submitFn(url) {
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) { setPush('Error: URL must start with http:// or https://', 'err'); return; }
    fetch('/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    }).then(res => {
      if (res.ok) { setPush('Opened in browser', 'ok'); pushInput.value = ''; pushInput.focus(); }
      else return res.json().then(d => { throw new Error(d.error); });
    }).catch(e => setPush('Error: ' + e.message, 'err'));
  }

  pushBtn.addEventListener('click', () => submitFn(pushInput.value.trim()));
  pushInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitFn(pushInput.value.trim()); });

  ipSelect.addEventListener('change', refreshQR);

  savePortBtn.addEventListener('click', async () => {
    const port = portInput.value.trim();
    if (!/^\d+$/.test(port)) { setCfg('Error: invalid port', 'err'); return; }
    try {
      const res = await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ port })
      });
      const d = await res.json();
      if (res.ok) { setCfg(d.message, 'ok'); currentPort = port; refreshQR(); }
      else setCfg('Error: ' + (d.error || 'failure'), 'err');
    } catch (e) { setCfg('Error: connection failed', 'err'); }
  });

  loadConfig();
</script>
</body>
</html>
